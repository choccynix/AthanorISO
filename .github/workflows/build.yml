name: Build AnthorOS

on:
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    container:
      image: gentoo/stage3:musl-llvm
      options: --privileged

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q

          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-util/catalyst ~amd64"
            echo "sys-kernel/dracut ~amd64"
            echo "app-misc/livecd-tools ~amd64"
          } > /etc/portage/package.accept_keywords/catalyst

          mkdir -p /etc/portage/package.use
          {
            echo "sys-apps/util-linux python"
            echo "sys-boot/grub grub_platforms_efi-32 grub_platforms_efi-64 grub_platforms_pc"
            echo "sys-kernel/installkernel grub dracut -ugrd -ukify -generic-uki"
            echo "sys-kernel/gentoo-kernel-bin -generic-uki"
            echo "sys-kernel/dracut -systemd"
          } > /etc/portage/package.use/catalyst-host

          emerge --nospinner -q \
            dev-util/catalyst \
            dev-vcs/git

      - name: Patch Catalyst to use gentoo-kernel-bin
        run: |
          echo "Searching for kmerge.sh..."
          KMERGE=""
          # Look in /usr first (standard for Portage installations)
          while IFS= read -r -d "" f; do
            KMERGE="${f}"
            break
          done < <(find /usr -name kmerge.sh -print0 2>/dev/null)
          
          # Fallback to searching the entire root / if not found
          if [[ -z "${KMERGE}" ]]; then
            while IFS= read -r -d "" f; do
              KMERGE="${f}"
              break
            done < <(find / /name kmerge.sh -print0 2>/dev/null)
          fi

          if [[ -z "${KMERGE}" ]]; then
            echo "ERROR: kmerge.sh not found anywhere"
            exit 1
          fi
          echo "Found: ${KMERGE}"
          sed -i 's|sys-kernel/gentoo-kernel"|sys-kernel/gentoo-kernel-bin"|' "${KMERGE}"
          echo "Verified:"
          grep "ksource" "${KMERGE}"

      - name: Checkout repository
        uses: actions/checkout@v6  # Updated from v4 to suppress the Node 20 deprecation warning
        with:
          path: anthoros

      - name: Create symlink to absolute path
        run: ln -s "$GITHUB_WORKSPACE/anthoros" /anthoros

      - name: Set VERSION
        run: |
          VERSION=$(date +%Y%m%d)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          # Save VERSION to a file so the release job can read it
          echo "${VERSION}" > /anthoros/VERSION.txt

      - name: Run build
        run: |
          chmod +x /anthoros/scripts/build.sh
          cd /anthoros
          VERSION="${VERSION}" ./scripts/build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anthoros-build-assets
          path: |
            /anthoros/output/*.iso
            /anthoros/output/*.iso.sha256
            /anthoros/output/*.tar.xz
            /anthoros/output/*.tar.xz.sha256
            /anthoros/VERSION.txt
          retention-days: 3

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    # Only run the release steps if triggered by schedule, manual selection, or a tag push
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: anthoros-build-assets
          path: release-assets

      - name: Read VERSION
        run: |
          VERSION=$(cat release-assets/VERSION.txt)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          # Clean up the file so it is not uploaded to the release
          rm release-assets/VERSION.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rolling-${VERSION}"
          BUILD_DATE=$(date +%Y-%m-%d)

          # Delete existing release and remote tag using the built-in clean up flag
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "AnthorOS Rolling Build ${BUILD_DATE}" \
            --notes "## AnthorOS Rolling Build — ${BUILD_DATE}

          Built from Gentoo stage3 musl+llvm+openrc using Catalyst.

          ### Downloads
          | File | Description |
          |---|---|
          | \`anthoros-amd64-*.iso\` | Bootable ISO (BIOS + UEFI) |
          | \`anthoros-stage3-amd64-*.tar.xz\` | Rootfs tarball |
          | \`*.sha256\` | SHA-256 checksums |

          Built by GitHub Actions · Run \`${{ github.run_number }}\`" \
            --latest \
            release-assets/*.iso \
            release-assets/*.iso.sha256 \
            release-assets/*.tar.xz \
            release-assets/*.tar.xz.sha256