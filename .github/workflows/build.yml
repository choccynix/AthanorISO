name: Build AnthorOS

on:
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Gentoo Build
        run: |
          # Write the container setup and build logic to a temporary script
          cat << 'EOF' > run_build.sh
          set -euo pipefail

          # Prepare and sync Portage
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q

          # Configure keywords
          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-util/catalyst ~amd64"
            echo "sys-kernel/dracut ~amd64"
            echo "app-misc/livecd-tools ~amd64"
          } > /etc/portage/package.accept_keywords/catalyst

          # Configure USE flags
          mkdir -p /etc/portage/package.use
          {
            echo "sys-apps/util-linux python"
            echo "sys-boot/grub grub_platforms_efi-32 grub_platforms_efi-64 grub_platforms_pc"
            echo "sys-kernel/installkernel grub dracut -ugrd -ukify -generic-uki"
            echo "sys-kernel/gentoo-kernel-bin -generic-uki"
            echo "sys-kernel/dracut -systemd"
          } > /etc/portage/package.use/catalyst-host

          # Install packages
          emerge --nospinner -q \
            dev-util/catalyst \
            dev-vcs/git

          # Patch Catalyst to use gentoo-kernel-bin
          echo "Searching for kmerge.sh..."
          KMERGE=""
          while IFS= read -r -d "" f; do
            KMERGE="${f}"
            break
          done < <(find /usr -name kmerge.sh -print0 2>/dev/null)
          
          if [[ -z "${KMERGE}" ]]; then
            while IFS= read -r -d "" f; do
              KMERGE="${f}"
              break
            done < <(find / -name kmerge.sh -print0 2>/dev/null)
          fi

          if [[ -z "${KMERGE}" ]]; then
            echo "ERROR: kmerge.sh not found anywhere"
            exit 1
          fi
          echo "Found: ${KMERGE}"
          sed -i 's|sys-kernel/gentoo-kernel"|sys-kernel/gentoo-kernel-bin"|' "${KMERGE}"
          echo "Verified:"
          grep "ksource" "${KMERGE}"

          # Set permissions and run the orchestrator build
          chmod +x /anthoros/scripts/build.sh
          cd /anthoros
          VERSION="${VERSION}" ./scripts/build.sh
          EOF

          chmod +x run_build.sh

          # Run the temporary script inside the privileged Gentoo musl container
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/anthoros" \
            -e VERSION="$(date +%Y%m%d)" \
            gentoo/stage3:musl-llvm \
            /anthoros/run_build.sh

      - name: Create GitHub Release
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') ||
          startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(date +%Y%m%d)
          TAG="rolling-${VERSION}"
          BUILD_DATE=$(date +%Y-%m-%d)

          # Delete existing release and tag using GitHub CLI natively on the host
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "AnthorOS Rolling Build ${BUILD_DATE}" \
            --notes "## AnthorOS Rolling Build — ${BUILD_DATE}

          Built from Gentoo stage3 musl+llvm+openrc using Catalyst.

          ### Downloads
          | File | Description |
          |---|---|
          | \`anthoros-amd64-*.iso\` | Bootable ISO (BIOS + UEFI) |
          | \`anthoros-stage3-amd64-*.tar.xz\` | Rootfs tarball |
          | \`*.sha256\` | SHA-256 checksums |

          Built by GitHub Actions · Run \`${{ github.run_number }}\`" \
            --latest \
            output/*.iso \
            output/*.iso.sha256 \
            output/*.tar.xz \
            output/*.tar.xz.sha256