name: Build AnthorOS

on:
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    container:
      image: gentoo/stage3:musl-llvm
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q

          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-util/catalyst ~amd64"
            echo "sys-kernel/dracut ~amd64"
            echo "app-misc/livecd-tools ~amd64"
          } > /etc/portage/package.accept_keywords/catalyst

          mkdir -p /etc/portage/package.use
          {
            echo "sys-apps/util-linux python"
            echo "sys-boot/grub grub_platforms_efi-32 grub_platforms_efi-64 grub_platforms_pc"
            echo "sys-kernel/installkernel grub dracut -ugrd -ukify -generic-uki"
            echo "sys-kernel/gentoo-kernel-bin -generic-uki"
            echo "sys-kernel/dracut -systemd"
          } > /etc/portage/package.use/catalyst-host

          emerge --nospinner -q \
            dev-util/catalyst \
            dev-vcs/git

      - name: Patch Catalyst bugs
        run: |
          # Use Python to do patches — avoids bash/sed/YAML escaping hell

          # Fix 1: main.py calls .extend() on a set (Python sets have no extend)
          MAIN_PY=""
          while IFS= read -r -d "" f; do
            MAIN_PY="${f}"
            break
          done < <(find / -path "*/catalyst/main.py" -print0 2>/dev/null)
          [[ -z "${MAIN_PY}" ]] && { echo "ERROR: catalyst/main.py not found"; exit 1; }
          echo "Patching: ${MAIN_PY}"

          python3 << EOF
import sys
path = "${MAIN_PY}"
with open(path) as f:
    src = f.read()
old = 'conf_values["options"].extend(options)'
rep = 'conf_values["options"] = set(list(conf_values["options"]) + list(options))'
if old in src:
    with open(path, "w") as f:
        f.write(src.replace(old, rep))
    print("Fix 1 applied")
else:
    print("Fix 1: pattern not found, may already be patched")
EOF

          # Fix 2: kmerge.sh hardcodes gentoo-kernel instead of gentoo-kernel-bin
          KMERGE=""
          while IFS= read -r -d "" f; do
            KMERGE="${f}"
            break
          done < <(find / -name kmerge.sh -print0 2>/dev/null)
          [[ -z "${KMERGE}" ]] && { echo "ERROR: kmerge.sh not found"; exit 1; }
          echo "Patching: ${KMERGE}"

          python3 << EOF
path = "${KMERGE}"
with open(path) as f:
    src = f.read()
patched = src.replace('sys-kernel/gentoo-kernel"', 'sys-kernel/gentoo-kernel-bin"')
with open(path, "w") as f:
    f.write(patched)
print("Fix 2 applied")
EOF

          echo "All patches done."

      - name: Checkout repository
