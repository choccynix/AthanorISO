name: Build AthanorOS

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - main_desktop_bin
      - dev
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: false
        default: false
      editions:
        description: 'Editions to build (minimal, desktop, or "minimal desktop")'
        required: false
        default: 'minimal desktop'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    container:
      image: gentoo/stage3:musl-llvm
      options: --privileged

    steps:
      - name: Install dependencies
        run: |

          emerge sec-keys/openpgp-keys-gentoozh
          getuto
          gpg --homedir /etc/portage/gnupg --import /usr/share/openpgp-keys/gentoozh.asc
          gpg --homedir /etc/portage/gnupg --batch --yes --pinentry-mode loopback \
          --passphrase-file /etc/portage/gnupg/pass --lsign-key 6A0726AF1476A2F382C6AC6638A0234EC16AD42E
          gpg --homedir /etc/portage/gnupg --check-trustdb

          mkdir -p /etc/portage/binrepos.conf
          cat > /etc/portage/binrepos.conf/gentoo-zh.conf <<'EOF'
          [gentoo-zh]
          priority = 10
          sync-uri = https://distfiles.gentoozh.org/binpkgs/x86-64
          verify-signature = true
          location = /var/cache/binhost/gentoo-zh
          EOF

          cat >> /etc/portage/make.conf <<'EOF'
          GENTOO_MIRRORS="${GENTOO_MIRRORS} https://distfiles.gentoozh.org https://mirrors.cernet.edu.cn/gentoo-zh https://mirror.nju.edu.cn/gentoo-zh https://mirror.nyist.edu.cn/gentoo-zh https://mirrors.ha.edu.cn/gentoo-zh"
          FEATURES="${FEATURES} getbinpkg"
          #EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --getbinpkg=y --binpkg-respect-use=y"
          ACCEPT_LICENSE="*"
          EOF


          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q

          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-util/catalyst ~amd64"
            echo "sys-kernel/dracut ~amd64"
            echo "app-misc/livecd-tools ~amd64"
          } > /etc/portage/package.accept_keywords/catalyst

          mkdir -p /etc/portage/package.use
          {
            echo "sys-apps/util-linux python"
            echo "sys-boot/grub grub_platforms_efi-32 grub_platforms_efi-64 grub_platforms_pc"
            echo "sys-kernel/installkernel grub dracut -ugrd -ukify -generic-uki"
            echo "sys-kernel/gentoo-kernel-bin -generic-uki"
            echo "sys-kernel/dracut -systemd"
          } > /etc/portage/package.use/catalyst-host

          emerge --nospinner -q dev-util/catalyst dev-vcs/git

      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/choccynix/AnthorISO.git" \
            /athanor

      - name: Patch Catalyst bugs
        run: python3 /athanor/scripts/patch-catalyst.py

      - name: Set VERSION
        run: echo "VERSION=$(date +%Y%m%d)" >> "${GITHUB_ENV}"

      - name: Run build
        run: |
          chmod +x /athanor/scripts/build.sh
          cd /athanor
          VERSION="${VERSION}" ./scripts/build.sh

      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish_release }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ env.VERSION }}
        run: python3 /athanor/scripts/upload-release.py /athanor/output
