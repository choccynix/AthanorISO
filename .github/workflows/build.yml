name: Build AnthorOS

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday at midnight UTC
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    container:
      image: gentoo/stage3:musl-llvm
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q

          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-util/catalyst ~amd64"
            echo "sys-kernel/dracut ~amd64"
            echo "app-misc/livecd-tools ~amd64"
          } > /etc/portage/package.accept_keywords/catalyst

          mkdir -p /etc/portage/package.use
          {
            echo "sys-apps/util-linux python"
            echo "sys-boot/grub grub_platforms_efi-32 grub_platforms_efi-64 grub_platforms_pc"
            echo "sys-kernel/installkernel grub dracut -ugrd -ukify -generic-uki"
            echo "sys-kernel/gentoo-kernel-bin -generic-uki"
            echo "sys-kernel/dracut -systemd"
          } > /etc/portage/package.use/catalyst-host

          emerge --nospinner -q dev-util/catalyst dev-vcs/git

      - name: Checkout repository
        run: git clone --depth=1 --branch "${{ github.ref_name }}" https://github.com/choccynix/AnthorISO.git /anthoros

      - name: Patch Catalyst bugs
        run: python3 /anthoros/scripts/patch-catalyst.py

      - name: Set VERSION
        run: echo "VERSION=$(date +%Y%m%d)" >> "${GITHUB_ENV}"

      - name: Run build
        run: |
          chmod +x /anthoros/scripts/build.sh
          cd /anthoros
          VERSION="${VERSION}" ./scripts/build.sh

      # ── Artifacts — all branches get these for dev/testing ───────────────────
      # Uses gh CLI (native binary, no Node.js needed) to upload to a
      # temporary artifacts release that acts as artifact storage
      - name: Upload build artifacts
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          ARTIFACT_TAG="artifacts-${SAFE_BRANCH}"
          BUILD_DATE=$(date +%Y-%m-%d)

          # Upload as a pre-release tagged to the branch so devs can find it
          gh release delete "${ARTIFACT_TAG}" \
            --repo "${{ github.repository }}" --yes 2>/dev/null || true

          gh release create "${ARTIFACT_TAG}" \
            --repo "${{ github.repository }}" \
            --title "Build artifact: ${BRANCH} (${BUILD_DATE})" \
            --notes "Dev build from branch \`${BRANCH}\` — run ${{ github.run_number }}. Not a stable release." \
            --prerelease \
            /anthoros/output/*.iso \
            /anthoros/output/*.iso.sha256 \
            /anthoros/output/*.tar.xz \
            /anthoros/output/*.tar.xz.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── GitHub Release — main branch and scheduled builds only ───────────────
      - name: Publish GitHub Release
        if: github.ref_name == 'main' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rolling-${VERSION}"
          BUILD_DATE=$(date +%Y-%m-%d)

          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git -C /anthoros push origin ":refs/tags/${TAG}" 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "AnthorOS Rolling Build ${BUILD_DATE}" \
            --notes "## AnthorOS Rolling Build — ${BUILD_DATE}

          Built from Gentoo stage3 musl+llvm+openrc using Catalyst.

          | File | Description |
          |---|---|
          | \`anthoros-amd64-*.iso\` | Bootable ISO (BIOS + UEFI) |
          | \`anthoros-stage3-amd64-*.tar.xz\` | Rootfs tarball |
          | \`*.sha256\` | SHA-256 checksums |

          **Verify:**
          \`\`\`bash
          sha256sum -c anthoros-amd64-${BUILD_DATE}.iso.sha256
          \`\`\`

          Built by GitHub Actions · Run \`${{ github.run_number }}\` · Branch \`main\`" \
            --latest \
            /anthoros/output/*.iso \
            /anthoros/output/*.iso.sha256 \
            /anthoros/output/*.tar.xz \
            /anthoros/output/*.tar.xz.sha256
