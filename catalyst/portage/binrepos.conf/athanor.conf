# /etc/portage/binrepos.conf/athanor.conf
#
# AthanorOS binary package repository. The Packages index is served by
# GitHub Pages; individual .gpkg.tar files are referenced by absolute URI
# inside that index and live in GitHub Releases.

[athanor]
priority = 9999
sync-uri = https://choccynix.github.io/athanor-binpkgs/
verify-signature = false
